<!doctype html>
<meta charset="utf-8">
<title>Generador de la tarjeta OG</title>
<style>
  /* Misma familia y mismos archivos que el sitio. Es una fuente variable:
     un solo woff2 cubre de 400 a 700. */
  @font-face{font-family:'Instrument Sans';font-weight:400 700;font-style:normal;
             font-display:block;src:url('/assets/instrument-sans-latin.woff2') format('woff2')}
  body{margin:0;background:#20242c;display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px;
       font:13px/1.4 ui-monospace,monospace;color:#9aa3b2}
  canvas{box-shadow:0 10px 40px rgba(0,0,0,.5);max-width:100%;height:auto}
</style>
<canvas id="c" width="1200" height="630"></canvas>
<div id="estado">preparando…</div>
<script>
// Tokens de :root del sitio.
const BG='#F6F8FC', INK='#08132A', INK3='rgba(8,19,42,.42)', PRO='#3D63E8', ONE='#0E7FBD';
const W=1200, H=630, M=76;               // margen: WhatsApp recorta los bordes
const estado = t => document.getElementById('estado').textContent = t;

const cargarImg = src => new Promise((ok, mal) => {
  const i = new Image(); i.onload = () => ok(i); i.onerror = mal; i.src = src;
});

/** Halo radial elíptico, como los radial-gradient del hero. */
function halo(ctx, cx, cy, rx, ry, color, alpha){
  ctx.save(); ctx.translate(cx, cy); ctx.scale(rx/ry, 1);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, ry);
  g.addColorStop(0, `rgba(${color},${alpha})`);
  g.addColorStop(0.7, `rgba(${color},0)`);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, ry, 0, 7); ctx.fill();
  ctx.restore();
}

async function dibujar(){
  await document.fonts.load("700 62px 'Instrument Sans'");
  await document.fonts.load("500 15px 'Instrument Sans'");
  await document.fonts.load("600 17px 'Instrument Sans'");
  await document.fonts.ready;

  const [anexy, pro, one] = await Promise.all([
    cargarImg('/assets/logo-anexy.png'),
    cargarImg('/assets/logo-anexypro.png'),
    cargarImg('/assets/logo-anexyone.png'),
  ]);

  const ctx = document.getElementById('c').getContext('2d');
  ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  halo(ctx, 216, -50, 450, 260, '61,99,232', .14);
  halo(ctx, 1056, 38, 380, 230, '14,127,189', .09);

  // ── zonas del lienzo ──────────────────────────────────────────────────
  // Nada de posiciones a ojo: el titular se dimensiona con lo que sobra entre
  // el logo y los chips, y se mide de verdad con measureText.
  const logoH = 50, logoY = 68;
  ctx.drawImage(anexy, M, logoY, logoH * anexy.width / anexy.height, logoH);

  const platH = 34, etiquetaPx = 19;
  const chipTop = 500;                       // borde superior de los logos de plataforma
  const techo = logoY + logoH + 42;          // el titular no sube más allá del logo
  const suelo = chipTop - 34;                // ni baja hasta los chips

  const lineas = [['Administración y', INK], ['operación inteligente', PRO], ['para condominios.', INK]];
  const util = W - M * 2;
  const fijar = px => { ctx.font = `700 ${px}px 'Instrument Sans'`; ctx.letterSpacing = '-0.035em'; };
  const anchoMax = px => { fijar(px); return Math.max(...lineas.map(([t]) => ctx.measureText(t).width)); };
  function altoBloque(px){
    fijar(px);
    const m = ctx.measureText('Ágp');        // con acento y descendente
    return m.actualBoundingBoxAscent + m.actualBoundingBoxDescent + px * 1.03 * 2;
  }

  // El mayor cuerpo que cabe a la vez de ancho y de alto.
  let TIT = 60;
  for (let px = 60; px <= 120; px += 0.5) {
    if (anchoMax(px) <= util * 0.96 && altoBloque(px) <= suelo - techo) TIT = px; else break;
  }
  const LH = TIT * 1.03;

  fijar(TIT);
  ctx.textBaseline = 'alphabetic';
  const asc = ctx.measureText('Á').actualBoundingBoxAscent;
  const alto = altoBloque(TIT);
  let y = techo + (suelo - techo - alto) / 2 + asc;   // bloque centrado en su zona
  for (const [t, color] of lineas){ ctx.fillStyle = color; ctx.fillText(t, M, y); y += LH; }
  ctx.letterSpacing = '0px';

  // Chips de plataforma, como los del hero pero a un tamaño que sobreviva a
  // la miniatura del chat.
  function chip(x, img, color, txt){
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.roundRect(x, chipTop + 5, 15, 15, 3.5); ctx.fill();
    const w = platH * img.width / img.height;
    ctx.drawImage(img, x + 31, chipTop, w, platH);
    ctx.font = `500 ${etiquetaPx}px 'Instrument Sans'`; ctx.fillStyle = INK3;
    ctx.fillText(txt, x + 31, chipTop + platH + 26);
    return 31 + w;
  }
  const ancho = chip(M, pro, PRO, 'Administración');
  chip(M + ancho + 92, one, ONE, 'Operación');

  window.__medidas = { TIT, anchoTitular: Math.round(anchoMax(TIT)), util,
                       altoTitular: Math.round(alto), zona: suelo - techo };

  estado('dibujado — guardando…');
  const blob = await new Promise(r => document.getElementById('c').toBlob(r, 'image/png'));
  const res = await fetch('/guardar', { method: 'POST', body: blob });
  estado(res.ok ? `guardado (${(blob.size/1024).toFixed(1)} KB)` : 'error al guardar');
  window.__listo = true;
}
dibujar().catch(e => { estado('error: ' + e.message); console.error(e); });
</script>
