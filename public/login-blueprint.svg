<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 817 1285" width="817" height="1285" role="img" aria-label="Plano arquitectónico de las áreas comunes de un condominio">
  <title>Plano de áreas comunes — ANEXYpro</title>

  <!--
    Portada del inicio de sesión.

    Redibujo vectorial del plano que se venía usando en JPEG. El original
    era un dibujo de líneas —solo el 1,8 % de sus píxeles eran trazo—
    sobre un fondo plano, que es justo lo que peor comprime el JPEG: cada
    línea blanca de un píxel sobre azul oscuro arrastraba ruido de
    compresión alrededor, y a 817 px de ancho se ampliaba más del doble
    en una pantalla retina.

    En vector no hay resolución que valga: se dibuja nítido a 817, a 1920
    y a 5K, pesa una fracción, y los rótulos son texto de verdad.
  -->

  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#0a1628" />
      <stop offset="55%" stop-color="#091324" />
      <stop offset="100%" stop-color="#070f1d" />
    </linearGradient>

    <!-- Retícula de papel de plano: apenas perceptible, da la textura. -->
    <pattern id="reticula" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#5b7fb5" stroke-width="0.5" opacity="0.075" />
    </pattern>
    <pattern id="reticulaFina" width="6.8" height="6.8" patternUnits="userSpaceOnUse">
      <path d="M6.8 0H0V6.8" fill="none" stroke="#5b7fb5" stroke-width="0.3" opacity="0.04" />
    </pattern>

    <!--
      Copa de árbol con follaje festoneado, no una rueda de radios: en
      los planos arquitectónicos la vegetación se dibuja con el borde
      irregular, y es lo que da carácter a la zona ajardinada. Hay dos
      variantes para que un grupo de árboles no parezca un sello
      repetido.
    -->
    <symbol id="arbol" viewBox="-24 -24 48 48">
      <path d="M21.0 0.0Q17.7 3.8 19.2 8.5Q15.1 11.0 14.1 15.6Q9.1 15.7 6.5 20.0Q1.8 17.1 -2.2 20.9Q-5.5 17.0 -10.5 18.2Q-12.2 13.5 -17.0 12.3Q-16.0 7.1 -20.5 4.4Q-17.4 0.0 -20.5 -4.4Q-17.5 -7.8 -17.0 -12.3Q-11.5 -12.8 -10.5 -18.2Q-5.8 -18.0 -2.2 -20.9Q2.0 -18.8 6.5 -20.0Q8.6 -14.9 14.1 -15.6Q15.6 -11.3 19.2 -8.5Q18.1 -3.9 21.0 0.0Z" fill="none" stroke="currentColor" stroke-width="1.15" />
      <circle r="3.4" fill="none" stroke="currentColor" stroke-width="0.9" />
      <path d="M3.6 0.2L17.8 1.2M3.2 1.7L17.3 9.2M2.4 2.6L12.1 13.3M1.2 3.4L6.5 18.1M-0.2 3.6L-1.1 18.0M-1.6 3.2L-8.9 17.9M-2.7 2.3L-13.7 11.5M-3.4 1.2L-16.8 6.0M-3.6 -0.2L-19.2 -0.9M-3.2 -1.6L-17.0 -8.5M-2.5 -2.6L-13.5 -14.2M-1.3 -3.3L-7.3 -18.5M0.4 -3.5L1.9 -17.2M1.7 -3.1L9.7 -17.3M2.6 -2.4L14.0 -12.9M3.4 -1.2L18.1 -6.3" stroke="currentColor" stroke-width="0.65" fill="none" />
    </symbol>

    <symbol id="arbol2" viewBox="-24 -24 48 48">
      <path d="M21.0 0.0Q16.4 4.4 18.2 10.5Q13.4 13.4 10.5 18.2Q4.4 16.2 0.0 21.0Q-4.3 16.1 -10.5 18.2Q-12.4 12.4 -18.2 10.5Q-17.3 4.6 -21.0 0.0Q-17.1 -4.6 -18.2 -10.5Q-12.4 -12.4 -10.5 -18.2Q-4.5 -16.8 -0.0 -21.0Q4.8 -18.0 10.5 -18.2Q13.2 -13.2 18.2 -10.5Q16.9 -4.5 21.0 0.0Z" fill="none" stroke="currentColor" stroke-width="1.15" />
      <circle r="3.2" fill="none" stroke="currentColor" stroke-width="0.9" />
      <path d="M3.6 0.0L20.2 0.2M3.1 1.7L17.4 9.7M1.9 3.0L10.0 15.3M0.2 3.6L0.8 18.1M-1.4 3.3L-7.4 17.4M-2.9 2.1L-16.2 11.5M-3.5 0.7L-17.4 3.6M-3.3 -1.3L-18.2 -6.9M-2.7 -2.4L-12.9 -11.6M-1.2 -3.4L-5.6 -16.4M0.6 -3.5L3.4 -19.2M2.2 -2.8L11.6 -15.2M3.3 -1.4L18.2 -8.0" stroke="currentColor" stroke-width="0.65" fill="none" />
    </symbol>

    <symbol id="arbustos" viewBox="-14 -14 28 28">
      <path d="M11.0 0.0Q9.0 2.9 8.9 6.5Q5.6 7.6 3.4 10.5Q0.0 8.6 -3.4 10.5Q-5.0 6.9 -8.9 6.5Q-8.9 2.9 -11.0 0.0Q-9.1 -3.0 -8.9 -6.5Q-5.7 -7.9 -3.4 -10.5Q-0.0 -9.6 3.4 -10.5Q5.6 -7.7 8.9 -6.5Q8.3 -2.7 11.0 0.0Z" fill="none" stroke="currentColor" stroke-width="0.95" />
      <path d="M1.9 0.2L9.9 1.0M1.4 1.2L6.9 6.0M0.2 1.9L1.3 10.4M-1.1 1.5L-5.5 7.8M-1.8 0.6L-9.7 3.1M-1.7 -0.7L-8.6 -3.7M-0.9 -1.6L-4.5 -8.0M0.4 -1.8L2.0 -10.3M1.5 -1.1L7.4 -5.6" stroke="currentColor" stroke-width="0.55" fill="none" />
    </symbol>

    <!-- Silla vista en planta. -->
    <symbol id="silla" viewBox="0 0 20 20">
      <rect x="2" y="4" width="16" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1" />
      <path d="M2 8h16" fill="none" stroke="currentColor" stroke-width="0.8" />
    </symbol>

    <!--
      Automóvil visto en planta, dibujado ya en vertical: rotarlo con
      `transform` lo desplazaba fuera de la plaza de parqueo.
    -->
    <symbol id="auto" viewBox="0 0 60 120">
      <rect x="4" y="2" width="52" height="116" rx="14" fill="none" stroke="currentColor" stroke-width="1.2" />
      <rect x="12" y="22" width="36" height="76" rx="9" fill="none" stroke="currentColor" stroke-width="0.9" />
      <path d="M12 40h36M12 80h36" stroke="currentColor" stroke-width="0.7" fill="none" />
      <path d="M14 8h32M14 112h32" stroke="currentColor" stroke-width="0.7" fill="none" />
    </symbol>

    <!-- Puerta con barrido de apertura. -->
    <symbol id="puerta" viewBox="0 0 40 40">
      <path d="M0 0v38" stroke="currentColor" stroke-width="1.4" fill="none" />
      <path d="M0 38A38 38 0 0 0 38 0" stroke="currentColor" stroke-width="0.7" fill="none" stroke-dasharray="3 3" />
    </symbol>
  </defs>

  <!-- ================= Fondo ================= -->
  <rect width="817" height="1285" fill="url(#fondo)" />
  <rect width="817" height="1285" fill="url(#reticulaFina)" />
  <rect width="817" height="1285" fill="url(#reticula)" />

  <!--
    Todo el dibujo hereda `currentColor`: cambiar el color de la marca es
    cambiar un único atributo en el grupo raíz.
  -->
  <g color="#ffffff" fill="none" stroke-linecap="square" stroke-linejoin="miter">

    <!-- ============ Ejes y cotas de fondo ============ -->
    <g stroke="currentColor" opacity="0.16" stroke-width="0.6" stroke-dasharray="7 5">
      <path d="M96 24V1240M410 24V1240M712 24V1240" />
      <path d="M40 60H784M40 392H784M40 640H784M40 736H784M40 1012H784M40 1188H784" />
    </g>
    <g stroke="currentColor" opacity="0.28" stroke-width="0.6">
      <path d="M330 34h84M330 30v8M414 30v8" />
      <path d="M760 44v96M756 44h8M756 140h8" />
    </g>

    <!-- ============ ÁREA COMÚN (jardín) ============ -->
    <g stroke="currentColor" opacity="0.9" stroke-width="2.6">
      <path d="M150 44H408V392H150z" />
    </g>
    <g stroke="currentColor" opacity="0.5" stroke-width="1.1">
      <!-- sendero curvo -->
      <path d="M172 372C214 300 236 236 300 210c38-16 74-40 92-78" />
      <path d="M188 380C230 306 250 246 314 222c38-14 70-38 86-72" />
    </g>
    <g color="#ffffff" opacity="0.46">
      <use href="#arbol" x="152" y="96" width="62" height="62" />
      <use href="#arbol2" x="198" y="60" width="52" height="52" />
      <use href="#arbol" x="256" y="86" width="44" height="44" />
      <use href="#arbol2" x="332" y="56" width="56" height="56" />
      <use href="#arbol" x="262" y="270" width="86" height="86" />
      <use href="#arbol2" x="196" y="288" width="52" height="52" />
      <use href="#arbustos" x="156" y="166" width="40" height="40" />
      <use href="#arbustos" x="222" y="146" width="32" height="32" />
      <use href="#arbustos" x="308" y="118" width="30" height="30" />
      <use href="#arbustos" x="168" y="326" width="34" height="34" />
      <use href="#arbustos" x="336" y="330" width="30" height="30" />
    </g>
    <!-- bancas -->
    <g stroke="currentColor" opacity="0.5" stroke-width="1">
      <rect x="286" y="188" width="34" height="15" rx="7" transform="rotate(-24 303 195)" />
      <rect x="352" y="196" width="34" height="15" rx="7" transform="rotate(16 369 203)" />
      <rect x="358" y="252" width="34" height="15" rx="7" transform="rotate(-8 375 259)" />
    </g>
    <text x="279" y="256" font-family="Helvetica, Arial, sans-serif" font-size="14.5" letter-spacing="2.4"
          fill="currentColor" opacity="0.95" text-anchor="middle">ÁREA COMÚN</text>

    <!-- ============ SALÓN SOCIAL ============ -->
    <g stroke="currentColor" opacity="0.9" stroke-width="3">
      <path d="M420 36H700V392H420z" />
    </g>
    <!-- cocineta superior -->
    <g stroke="currentColor" opacity="0.5" stroke-width="1">
      <rect x="500" y="52" width="150" height="34" />
      <path d="M538 52v34M576 52v34M614 52v34" />
      <rect x="512" y="60" width="18" height="18" rx="3" />
      <rect x="588" y="60" width="18" height="18" rx="3" />
    </g>
    <!-- mesa de comedor con sillas -->
    <g stroke="currentColor" opacity="0.6" stroke-width="1.2">
      <rect x="486" y="176" width="130" height="72" rx="4" />
    </g>
    <g color="#ffffff" opacity="0.5">
      <use href="#silla" x="496" y="146" width="26" height="26" />
      <use href="#silla" x="538" y="146" width="26" height="26" />
      <use href="#silla" x="580" y="146" width="26" height="26" />
      <use href="#silla" x="496" y="252" width="26" height="26" transform="rotate(180 509 265)" />
      <use href="#silla" x="538" y="252" width="26" height="26" transform="rotate(180 551 265)" />
      <use href="#silla" x="580" y="252" width="26" height="26" transform="rotate(180 593 265)" />
    </g>
    <!-- sofás -->
    <g stroke="currentColor" opacity="0.5" stroke-width="1">
      <rect x="530" y="316" width="120" height="44" rx="7" />
      <path d="M530 330h120M560 316v44M600 316v44" />
      <rect x="668" y="150" width="24" height="52" rx="6" />
      <rect x="668" y="216" width="24" height="44" rx="6" />
    </g>
    <text x="560" y="222" font-family="Helvetica, Arial, sans-serif" font-size="14.5" letter-spacing="2.4"
          fill="currentColor" opacity="0.95" text-anchor="middle">SALÓN SOCIAL</text>

    <!-- ============ GIMNASIO ============ -->
    <g stroke="currentColor" opacity="0.9" stroke-width="3">
      <path d="M488 400H716V640H488z" />
    </g>
    <g stroke="currentColor" opacity="0.5" stroke-width="1">
      <!-- caminadoras -->
      <rect x="640" y="470" width="34" height="58" rx="5" />
      <path d="M640 490h34" />
      <rect x="682" y="470" width="34" height="58" rx="5" />
      <path d="M682 490h34" />
      <!-- banco y barra -->
      <rect x="530" y="500" width="52" height="18" rx="4" />
      <circle cx="524" cy="509" r="9" />
      <circle cx="588" cy="509" r="9" />
      <!-- pesas -->
      <rect x="536" y="556" width="60" height="14" rx="4" />
      <circle cx="530" cy="563" r="7" />
      <circle cx="602" cy="563" r="7" />
      <!-- colchoneta -->
      <rect x="640" y="560" width="60" height="30" rx="5" />
    </g>
    <text x="614" y="452" font-family="Helvetica, Arial, sans-serif" font-size="14" letter-spacing="2.2"
          fill="currentColor" opacity="0.95" text-anchor="middle">GIMNASIO</text>

    <!-- ============ Núcleo de circulación ============ -->
    <!-- escalera -->
    <g stroke="currentColor" opacity="0.85" stroke-width="2.2">
      <path d="M78 404H176V628H78z" />
    </g>
    <g stroke="currentColor" opacity="0.45" stroke-width="0.9">
      <path d="M78 424h98M78 444h98M78 464h98M78 484h98M78 504h98M78 524h98M78 544h98M78 564h98M78 584h98M78 604h98" />
      <path d="M127 404v224" />
    </g>
    <g stroke="currentColor" opacity="0.6" stroke-width="1">
      <path d="M127 612l-9-14h18z" />
    </g>

    <!-- elevador -->
    <g stroke="currentColor" opacity="0.9" stroke-width="2.4">
      <path d="M268 500H366V618H268z" />
    </g>
    <g stroke="currentColor" opacity="0.45" stroke-width="0.9">
      <path d="M268 500l98 118M366 500l-98 118" />
    </g>
    <text x="317" y="566" font-family="Helvetica, Arial, sans-serif" font-size="12.5" letter-spacing="1.9"
          fill="currentColor" opacity="0.95" text-anchor="middle">ELEVADOR</text>

    <!-- pasillo -->
    <g stroke="currentColor" opacity="0.85" stroke-width="2.4">
      <path d="M40 656H716M40 656v72M40 728H716" />
    </g>
    <g stroke="currentColor" opacity="0.3" stroke-width="0.8" stroke-dasharray="6 6">
      <path d="M40 692H716" />
    </g>

    <!-- ============ ADMINISTRACIÓN ============ -->
    <g stroke="currentColor" opacity="0.9" stroke-width="3">
      <path d="M180 744H428V1012H180z" />
    </g>
    <g stroke="currentColor" opacity="0.5" stroke-width="1">
      <!-- mesa de reuniones -->
      <path d="M268 836l40-22 40 22v52l-40 22-40-22z" />
      <!-- sillas alrededor -->
      <circle cx="252" cy="846" r="10" />
      <circle cx="252" cy="880" r="10" />
      <circle cx="364" cy="846" r="10" />
      <circle cx="364" cy="880" r="10" />
      <circle cx="308" cy="798" r="10" />
      <circle cx="308" cy="928" r="10" />
      <!-- archivadores -->
      <rect x="196" y="782" width="26" height="88" />
      <path d="M196 812h26M196 842h26" />
      <rect x="196" y="884" width="26" height="58" />
      <!-- sofá de espera -->
      <rect x="196" y="954" width="72" height="26" rx="6" />
      <path d="M232 954v26" />
    </g>
    <g color="#ffffff" opacity="0.6">
      <use href="#puerta" x="404" y="758" width="26" height="26" />
    </g>
    <text x="304" y="838" font-family="Helvetica, Arial, sans-serif" font-size="13.5" letter-spacing="2.1"
          fill="currentColor" opacity="0.95" text-anchor="middle">ADMINISTRACIÓN</text>

    <!-- ============ OFICINA ============ -->
    <g stroke="currentColor" opacity="0.9" stroke-width="3">
      <path d="M488 744H712V1012H488z" />
    </g>
    <g stroke="currentColor" opacity="0.5" stroke-width="1">
      <!-- escritorio -->
      <rect x="556" y="900" width="104" height="34" rx="3" />
      <circle cx="608" cy="884" r="11" />
      <!-- sillón -->
      <rect x="556" y="782" width="60" height="40" rx="8" />
      <path d="M556 796h60" />
      <rect x="640" y="782" width="46" height="40" rx="8" />
      <!-- credenza -->
      <rect x="500" y="940" width="26" height="56" />
      <path d="M500 968h26" />
    </g>
    <text x="600" y="858" font-family="Helvetica, Arial, sans-serif" font-size="13.5" letter-spacing="2.1"
          fill="currentColor" opacity="0.95" text-anchor="middle">OFICINA</text>

    <!-- ============ PARQUEO ============ -->
    <g stroke="currentColor" opacity="0.9" stroke-width="2.6">
      <path d="M18 1000H172V1244H18z" />
      <path d="M18 1108H172M18 1204H172" />
    </g>
    <g color="#ffffff" opacity="0.5">
      <use href="#auto" x="60" y="1010" width="70" height="92" />
      <use href="#auto" x="60" y="1114" width="70" height="84" />
    </g>
    <text x="95" y="1230" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="2"
          fill="currentColor" opacity="0.95" text-anchor="middle">PARQUEO</text>

    <!-- ============ SEGURIDAD ============ -->
    <g stroke="currentColor" opacity="0.9" stroke-width="3">
      <path d="M180 1020H428V1200H180z" />
    </g>
    <g stroke="currentColor" opacity="0.5" stroke-width="1">
      <!-- mostrador -->
      <rect x="212" y="1104" width="132" height="26" rx="4" />
      <!-- monitores -->
      <rect x="222" y="1074" width="26" height="20" rx="2" />
      <rect x="256" y="1074" width="26" height="20" rx="2" />
      <rect x="290" y="1074" width="26" height="20" rx="2" />
      <!-- sillas -->
      <circle cx="246" cy="1150" r="11" />
      <circle cx="300" cy="1150" r="11" />
      <!-- lockers -->
      <rect x="366" y="1062" width="24" height="70" />
      <path d="M366 1085h24M366 1108h24" />
    </g>
    <text x="304" y="1052" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="2"
          fill="currentColor" opacity="0.95" text-anchor="middle">SEGURIDAD</text>

    <!-- ============ ACCESO PRINCIPAL ============ -->
    <g stroke="currentColor" opacity="0.9" stroke-width="3">
      <path d="M488 1020H700V1200H488z" />
    </g>
    <g color="#ffffff" opacity="0.6">
      <use href="#puerta" x="676" y="1034" width="30" height="30" transform="rotate(90 691 1049)" />
    </g>
    <g stroke="currentColor" opacity="0.45" stroke-width="1">
      <path d="M520 1200v-46h148v46" />
      <path d="M552 1200v-46M584 1200v-46M616 1200v-46M648 1200v-46" />
    </g>
    <text x="594" y="1074" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="2"
          fill="currentColor" opacity="0.95" text-anchor="middle">ACCESO</text>
    <text x="594" y="1094" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="2"
          fill="currentColor" opacity="0.95" text-anchor="middle">PRINCIPAL</text>

    <!-- ============ Vegetación perimetral derecha ============ -->
    <g color="#ffffff" opacity="0.4">
      <use href="#arbol" x="716" y="60" width="58" height="58" />
      <use href="#arbustos" x="730" y="128" width="32" height="32" />
      <use href="#arbol" x="718" y="640" width="62" height="62" />
      <use href="#arbol2" x="726" y="706" width="48" height="48" />
      <use href="#arbustos" x="730" y="764" width="34" height="34" />
      <use href="#arbustos" x="726" y="806" width="30" height="30" />
      <use href="#arbustos" x="734" y="846" width="26" height="26" />
      <use href="#arbustos" x="728" y="884" width="30" height="30" />
      <use href="#arbustos" x="732" y="1088" width="32" height="32" />
      <use href="#arbol2" x="714" y="1136" width="66" height="66" />
    </g>

    <!-- ============ Perímetro exterior ============ -->
    <g stroke="currentColor" opacity="0.55" stroke-width="1.4">
      <path d="M14 30H802V1256H14z" />
    </g>
    <g stroke="currentColor" opacity="0.22" stroke-width="0.7">
      <path d="M22 38H794V1248H22z" />
    </g>
  </g>
</svg>
